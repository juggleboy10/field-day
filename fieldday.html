<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Day</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Big+Shoulders+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #1d1a36;
  --panel: rgba(250, 249, 255, 0.95);
  --ink: #1b1932;
  --muted: #55517a;
  --line: rgba(27, 25, 50, 0.18);
  --field: #ffffff;
  --accent: #f5821f;
  --on-accent: #1b1932;
  --focus: #3a6df0;
  --error: #c42f2f;
  --hud: rgba(18, 16, 38, 0.62);
  --hud-ink: #f6f4ff;
  --display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --panel: rgba(27, 24, 52, 0.94);
    --ink: #f3f1fc;
    --muted: #b7b2d6;
    --line: rgba(255, 255, 255, 0.18);
    --field: rgba(255, 255, 255, 0.06);
    --focus: #8fb0ff;
    --error: #ff8a8a;
  }
}
:root[data-theme="dark"] {
  --panel: rgba(27, 24, 52, 0.94);
  --ink: #f3f1fc;
  --muted: #b7b2d6;
  --line: rgba(255, 255, 255, 0.18);
  --field: rgba(255, 255, 255, 0.06);
  --focus: #8fb0ff;
  --error: #ff8a8a;
}
*, *::before, *::after { box-sizing: inherit; }
[hidden] { display: none !important; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; overflow: hidden;
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--body);
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
#scene { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }

/* Start panel */
.panel {
  position: fixed; left: 20px; bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  width: min(380px, calc(100% - 40px));
  max-height: calc(100% - 40px); overflow-y: auto;
  background: var(--panel); color: var(--ink);
  border-radius: 20px; padding: 26px 24px 22px;
  box-shadow: 0 24px 70px rgba(8, 6, 28, 0.5);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.panel h1 {
  margin: 0 0 10px;
  font-family: var(--display); font-weight: 800;
  font-size: 68px; line-height: 0.86; letter-spacing: 0.005em;
}
.lede { margin: 0 0 16px; color: var(--muted); font-size: 15px; max-width: 34ch; }
.net { display: flex; align-items: flex-start; gap: 9px; margin: 0 0 18px; font-size: 14px; font-weight: 700; line-height: 1.35; }
.net .dot { width: 9px; height: 9px; margin-top: 5px; border-radius: 50%; background: #9a96b8; flex: none; }
.net[data-state="online"] .dot { background: #2fbf71; box-shadow: 0 0 0 4px rgba(47, 191, 113, 0.22); }
.net[data-state="solo"] .dot { background: #e0a000; }
.field-label { display: block; font-size: 13px; font-weight: 700; margin: 0 0 6px; color: var(--muted); padding: 0; }
.levels { margin: 0 0 16px; }
.level-list { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.level {
  position: relative; display: flex; gap: 9px; align-items: center;
  padding: 8px 10px; border: 1.5px solid var(--line); border-radius: 12px; cursor: pointer; min-width: 0;
}
.level input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.level .glyph { font-size: 24px; line-height: 1; flex: none; }
.level .txt { flex: 1; min-width: 0; }
.level .glyph { font-size: 20px; }
.level strong { display: block; font-size: 14px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }
.level .count { display: block; font-size: 12px; font-weight: 700; color: var(--muted); white-space: nowrap; }
.level-blurb { margin: 8px 0 0; font-size: 13.5px; color: var(--muted); min-height: 1.5em; }
.look-row { display: flex; gap: 14px; align-items: center; }
#look-preview { width: 84px; height: 84px; flex: none; border-radius: 14px; background: var(--chip-bg, rgba(127,127,160,0.12)); }
.look-opts { display: grid; gap: 8px; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.chips .chips-label { font-size: 12.5px; font-weight: 700; color: var(--muted); width: 2.8em; }
.chip { position: relative; display: inline-block; cursor: pointer; }
.chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.chip span { display: block; padding: 3px 9px; border-radius: 999px; border: 1.5px solid var(--line); font-size: 13px; line-height: 1.4; }
.chip input:checked + span { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.chip input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 2px; }
.level.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.level:focus-within { outline: 3px solid var(--focus); outline-offset: 2px; }
#name {
  width: 100%; font: inherit; font-size: 17px; padding: 10px 12px;
  border-radius: 10px; border: 1.5px solid var(--line);
  background: var(--field); color: var(--ink); margin: 0 0 14px;
}
fieldset { border: 0; padding: 0; margin: 0 0 20px; min-width: 0; }
.swatch-row { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { position: relative; display: block; cursor: pointer; }
.swatch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.swatch span { display: block; width: 34px; height: 34px; border-radius: 50%; background: var(--c); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18); }
.swatch input:checked + span { outline: 3px solid var(--ink); outline-offset: 3px; }
.swatch input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 3px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  flex: 1 1 140px; font: inherit; font-weight: 700; font-size: 16px;
  padding: 12px 16px; border-radius: 12px;
  border: 1.5px solid var(--line); background: transparent; color: var(--ink); cursor: pointer;
}
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn:focus-visible, .hud-btn:focus-visible, #name:focus-visible, .touch-btns button:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.note { margin: 12px 0 0; font-size: 13.5px; color: var(--muted); }
.note.error { color: var(--error); }

/* In-game HUD (sits over the dusk scene, so it keeps one dark style in both themes) */
#hud { position: fixed; inset: 0; pointer-events: none; color: var(--hud-ink); }
.hud-left {
  position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); left: 14px;
  padding: 8px 12px 6px; background: var(--hud); border-radius: 12px; min-width: 170px; font-size: 14px;
}
.hud-title { margin: 0 0 2px; font-family: var(--display); font-weight: 800; font-size: 20px; line-height: 1.1; color: #ffb866; }
.hud-scores { margin: 0; padding: 0; list-style: none; }
.hud-scores li { display: flex; align-items: center; gap: 8px; line-height: 1.75; }
.hud-scores .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.hud-scores .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.hud-scores .me .nm { font-weight: 700; }
.hud-scores .sc { font-family: var(--display); font-weight: 800; font-size: 19px; min-width: 2ch; text-align: right; white-space: nowrap; }
.hud-actions { position: absolute; top: calc(14px + env(safe-area-inset-top, 0px)); right: 14px; display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; max-width: calc(100% - 220px); pointer-events: auto; }
#hud-level-actions { display: contents; }
.hud-btn {
  font: inherit; font-size: 14px; font-weight: 700; color: var(--hud-ink);
  background: var(--hud); border: 1px solid rgba(255, 255, 255, 0.2);
  padding: 8px 14px; border-radius: 10px; cursor: pointer;
}
#crosshair {
  position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px;
  border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.85);
  transition: transform 0.12s ease, border-color 0.12s ease;
}
#crosshair.on { transform: scale(2.2); border-color: var(--accent); }
#power { position: absolute; left: 50%; top: calc(50% + 26px); width: 120px; height: 8px; margin-left: -60px; border-radius: 4px; background: rgba(255, 255, 255, 0.25); overflow: hidden; }
#power-fill { height: 100%; width: 0; background: var(--accent); }
.hints {
  position: absolute; left: 50%; transform: translateX(-50%);
  bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 16px; flex-wrap: wrap; justify-content: center;
  font-size: 13.5px; background: var(--hud); padding: 8px 14px; border-radius: 12px;
  width: max-content; max-width: calc(100% - 28px);
}
kbd {
  font: inherit; font-weight: 700; padding: 1px 6px; margin-right: 5px; border-radius: 5px;
  background: rgba(255, 255, 255, 0.16); border-bottom: 2px solid rgba(255, 255, 255, 0.3);
}
#touch { position: absolute; inset: 0; }
#stick {
  position: absolute; left: 96px; top: calc(100% - 120px - env(safe-area-inset-bottom, 0px));
  width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
  background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.3);
}
#stick-knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(255, 255, 255, 0.55); }
.touch-btns { position: absolute; right: 16px; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; align-items: center; gap: 14px; pointer-events: auto; }
.touch-btns button {
  width: 88px; height: 88px; border-radius: 50%; font: inherit; font-weight: 700; font-size: 15px; line-height: 1.15;
  color: var(--hud-ink); background: var(--hud); border: 2px solid rgba(255, 255, 255, 0.3);
  touch-action: none; user-select: none; -webkit-user-select: none;
}
.touch-btns #btn-throw { background: var(--accent); border-color: var(--accent); color: #1b1932; }
.hud-status {
  position: absolute; left: 50%; transform: translateX(-50%); top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex; gap: 14px; align-items: center; white-space: nowrap;
  background: var(--hud); padding: 6px 14px; border-radius: 12px; font-size: 15px; font-weight: 700;
}
.hud-status .hearts { color: #ff5a74; font-size: 20px; letter-spacing: 2px; }
.hud-status .obj { font-weight: 400; color: #e4dff8; }
#hurt {
  position: fixed; inset: 0; pointer-events: none; opacity: 0;
  background: radial-gradient(ellipse at center, rgba(255,40,40,0) 45%, rgba(200,0,0,0.75) 100%);
}
#hurt.down { background: radial-gradient(ellipse at center, rgba(40,0,0,0.55) 0%, rgba(30,0,0,0.9) 100%); }
#toast {
  position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
  transform: translate(-50%, -8px); opacity: 0; pointer-events: none;
  background: var(--accent); color: #1b1932;
  font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1.2;
  padding: 6px 18px; border-radius: 12px; white-space: nowrap;
  transition: opacity 0.2s ease, transform 0.2s ease;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 560px) {
  .panel { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); padding: 20px 18px 18px; }
  .panel h1 { font-size: 54px; }
  .hud-left { min-width: 0; font-size: 13px; }
  .hud-actions { max-width: calc(100% - 160px); }
  .hud-scores .nm { max-width: 96px; }
  #toast { top: calc(110px + env(safe-area-inset-top, 0px)); }
  .hud-status { top: calc(60px + env(safe-area-inset-top, 0px)); font-size: 13px; gap: 10px; }
  .hud-status .obj { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  #crosshair, #toast { transition: none; }
}
</style>
</head>
<body>
<canvas id="scene" aria-label="3D game world"></canvas>

<section id="panel" class="panel" aria-labelledby="title">
  <h1 id="title">Field Day</h1>
  <p class="lede">A clubhouse and nine games to play with friends, in VR or right here in the browser. Everyone who has this page open can join you.</p>
  <p id="net" class="net" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="net-text">Looking for other players…</span></p>
  <fieldset class="levels">
    <legend class="field-label">Pick a game</legend>
    <div id="levels" class="level-list"></div>
    <p id="level-blurb" class="level-blurb"></p>
  </fieldset>
  <label class="field-label" for="name">Your name</label>
  <input id="name" maxlength="16" autocomplete="nickname" spellcheck="false">
  <fieldset>
    <legend class="field-label">Your color</legend>
    <div id="swatches" class="swatch-row"></div>
  </fieldset>
  <fieldset>
    <legend class="field-label">Your look</legend>
    <div class="look-row">
      <canvas id="look-preview" width="168" height="168" aria-hidden="true"></canvas>
      <div class="look-opts">
        <div class="chips" id="hat-chips" role="radiogroup" aria-label="Hat"><span class="chips-label">Hat</span></div>
        <div class="chips" id="face-chips" role="radiogroup" aria-label="Face"><span class="chips-label">Face</span></div>
      </div>
    </div>
  </fieldset>
  <div class="actions">
    <button id="btn-vr" class="btn primary" type="button">Enter VR</button>
    <button id="btn-flat" class="btn" type="button">Play in browser</button>
  </div>
  <p id="vr-note" class="note" hidden></p>
  <p id="load-error" class="note error" hidden>The 3D engine didn't load. Check your connection and reload the page.</p>
</section>

<div id="hud" hidden>
  <div class="hud-left">
    <p id="hud-title" class="hud-title"></p>
    <ol id="hud-scores" class="hud-scores" aria-label="Scores"></ol>
  </div>
  <div class="hud-actions">
    <span id="hud-level-actions"></span>
    <button id="btn-menu" class="hud-btn" type="button">Menu</button>
  </div>
  <div id="hud-status" class="hud-status" role="status" hidden></div>
  <div id="crosshair" aria-hidden="true"></div>
  <div id="power" aria-hidden="true" hidden><div id="power-fill"></div></div>
  <div id="hints" class="hints"></div>
  <div id="touch" hidden>
    <div id="stick" aria-hidden="true"><div id="stick-knob"></div></div>
    <div class="touch-btns">
      <button id="btn-grab" type="button">Grab</button>
      <button id="btn-throw" type="button">Hold to throw</button>
    </div>
  </div>
</div>
<div id="hurt" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const ui = {
    panel: $('#panel'), net: $('#net'), netText: $('#net-text'), levels: $('#levels'), name: $('#name'), swatches: $('#swatches'),
    vrBtn: $('#btn-vr'), flatBtn: $('#btn-flat'), vrNote: $('#vr-note'), loadError: $('#load-error'),
    hud: $('#hud'), hudTitle: $('#hud-title'), hudScores: $('#hud-scores'), hudLevelActions: $('#hud-level-actions'), menuBtn: $('#btn-menu'),
    cross: $('#crosshair'), power: $('#power'), powerFill: $('#power-fill'), hints: $('#hints'),
    touch: $('#touch'), stick: $('#stick'), knob: $('#stick-knob'), grabBtn: $('#btn-grab'), throwBtn: $('#btn-throw'),
    toast: $('#toast'), status: $('#hud-status'), hurt: $('#hurt'),
    levelBlurb: $('#level-blurb'), lookPreview: $('#look-preview'), hatChips: $('#hat-chips'), faceChips: $('#face-chips'),
  };
  function fail(msg) {
    if (msg) ui.loadError.textContent = msg;
    ui.loadError.hidden = false;
    ui.vrBtn.disabled = true;
    ui.flatBtn.disabled = true;
  }
  if (!window.THREE) { fail(); return; }

  // ---------------------------------------------------------------- constants
  const V3 = THREE.Vector3, Q4 = THREE.Quaternion;
  const SIDES = ['left', 'right'];
  const UP = new V3(0, 1, 0);
  const FWD = new V3(0, 0, -1);
  const GRAVITY = 9.8;
  const PLAYER_COLORS = [
    { hex: '#4fc3f7', label: 'Sky blue' },
    { hex: '#ff5c8a', label: 'Pink' },
    { hex: '#8bd450', label: 'Lime' },
    { hex: '#b388ff', label: 'Violet' },
    { hex: '#ffd23f', label: 'Yellow' },
    { hex: '#2ec4b6', label: 'Teal' },
  ];
  const DISPLAY = '"Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif';
  const BODY = '"Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif';
  const HOLD_OFF = new V3(0, -0.015, -0.085);
  const DESK_OFF = { left: new V3(-0.26, -0.34, -0.3), right: new V3(0.2, -0.22, -0.36) };
  const PREF_KEY = 'field-day-prefs';
  const LEVEL_COUNT = 10;
  const HUB = 8;
  const HATS = ['None', 'Cap', 'Beanie', 'Party hat', 'Crown'];
  const FACES = ['Dots', 'Happy', 'Shades', 'Wink'];
  const TEAM_COLORS = [0xff4d6a, 0x4fc3f7];
  const TEAM_HEX = ['#ff4d6a', '#4fc3f7'];
  const TEAM_NAMES = ['Red', 'Blue'];
  const TERMINAL = ['revoked', 'not_granted', 'capability_disabled', 'capability_removed', 'transform_error'];
  const reduceMotion = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  const coarse = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);

  // ---------------------------------------------------------------- helpers
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const r3 = (x) => Math.round(x * 1000) / 1000;
  const finite = (x) => typeof x === 'number' && Number.isFinite(x);
  const lerp = (a, b, t) => a + (b - a) * t;
  function cleanName(s) {
    return String(s == null ? '' : s)
      .replace(/[\u0000-\u001f\u007f-\u009f\u00ad\u200b-\u200f\u202a-\u202e\u2060-\u206f\ufeff]/g, '')
      .replace(/\s+/g, ' ')
      .trim()
      .slice(0, 16);
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function rr(g, x, y, w, h, r) {
    g.beginPath();
    g.moveTo(x + r, y);
    g.arcTo(x + w, y, x + w, y + h, r);
    g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r);
    g.arcTo(x, y, x + w, y, r);
    g.closePath();
  }
  function wrapText(g, text, x, y, maxW, lh) {
    const words = text.split(' ');
    let line = '';
    for (const w of words) {
      const t = line ? line + ' ' + w : w;
      if (line && g.measureText(t).width > maxW) { g.fillText(line, x, y); y += lh; line = w; }
      else line = t;
    }
    if (line) { g.fillText(line, x, y); y += lh; }
    return y;
  }
  function toPar(n) { return n === 0 ? 'E' : n > 0 ? `+${n}` : String(n); }

  // ---------------------------------------------------------------- prefs + state
  const prefs = (() => {
    for (const k of [PREF_KEY, 'rooftop-hoops-prefs']) {
      try {
        const p = JSON.parse(localStorage.getItem(k) || 'null');
        if (p && typeof p === 'object') return p;
      } catch (e) { /* ignore */ }
    }
    return {};
  })();
  const savedName = cleanName(prefs.name);
  const state = {
    mode: 'menu',
    level: Number.isInteger(prefs.level) && prefs.level >= 0 && prefs.level < LEVEL_COUNT ? prefs.level : HUB,
    hat: Number.isInteger(prefs.hat) && prefs.hat >= 0 && prefs.hat < HATS.length ? prefs.hat : 0,
    face: Number.isInteger(prefs.face) && prefs.face >= 0 && prefs.face < FACES.length ? prefs.face : 0,
    name: savedName || `Player ${10 + Math.floor(Math.random() * 90)}`,
    nameEdited: !!savedName,
    colorIdx: Number.isInteger(prefs.color) && prefs.color >= 0 && prefs.color < PLAYER_COLORS.length
      ? prefs.color : Math.floor(Math.random() * PLAYER_COLORS.length),
    myPeer: 'solo',
    room: null, net: 'connecting', connected: false, everConnected: false, discT: 0, lastPeers: null,
    presenceT: -1e9, presenceDue: true, lastPresence: '',
    dirtyBoard: true, boardT: 0, netUiT: 0, hudDirty: true,
    yaw: 0, pitch: -0.06, keys: Object.create(null), charge: null, held: null, flatTarget: null,
    vrOK: false, flashT: -1e9,
  };
  function savePrefs() {
    try {
      localStorage.setItem(PREF_KEY, JSON.stringify({ name: state.nameEdited ? state.name : '', color: state.colorIdx, level: state.level, hat: state.hat, face: state.face }));
    } catch (e) { /* storage unavailable */ }
  }
  function forcePresence() { state.presenceDue = true; }

  // ---------------------------------------------------------------- renderer, scene, camera
  let renderer;
  try {

  function makePlate(parent, label, w, h, pos, rotY, opts) {
    let text = label;
    const o = opts || {};
    const cw = 512, ch = Math.round(512 * h / w);
    const ct = canvasTexture(cw, ch);
    const draw = () => {
      const g = ct.g;
      g.fillStyle = o.bg || '#16142e'; g.fillRect(0, 0, cw, ch);
      g.fillStyle = o.fg || '#f4f2ff';
      g.font = `800 ${Math.round(ch * (o.size || 0.62))}px ${DISPLAY}`;
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillText(text, cw / 2, ch * 0.54, cw - 24);
      ct.tex.needsUpdate = true;
    };
    draw();
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: ct.tex }));
    m.position.copy(pos);
    m.rotation.y = rotY || 0;
    m.userData.draw = (t) => { text = t; draw(); };
    if (o.tilt) m.rotation.x = o.tilt;
    parent.add(m);
    redraws.push(draw);

  function readPose(a, out) {

    out.pos.set(clamp(a[0], -300, 300), clamp(a[1], -20, 60), clamp(a[2], -300, 300));
    out.quat.set(a[3], a[4], a[5], a[6]);

    return true;

  const _fwd = new V3();
  function updateRemotes(dt) {
    const k = 1 - Math.exp(-dt * 14);
    for (const rec of remotes.values()) {
      const show = inMyLevel(rec) && rec.hasH;
      for (const p of rec.parts) p.visible = show;
      if (!show) continue;
      const cur = rec.cur, tgt = rec.tgt;
      cur.h.pos.lerp(tgt.h.pos, k); cur.h.quat.slerp(tgt.h.quat, k);
      if (rec.hasL) { cur.l.pos.lerp(tgt.l.pos, k); cur.l.quat.slerp(tgt.l.quat, k); }
      if (rec.hasR) { cur.r.pos.lerp(tgt.r.pos, k); cur.r.quat.slerp(tgt.r.quat, k); }
      rec.head.position.copy(cur.h.pos);
      rec.head.quaternion.copy(cur.h.quat);
      _fwd.set(0, 0, -1).applyQuaternion(cur.h.quat);
      rec.body.position.set(cur.h.pos.x, cur.h.pos.y - 0.44, cur.h.pos.z);
      rec.body.rotation.set(0, Math.atan2(-_fwd.x, -_fwd.z), 0);
      rec.lh.visible = rec.hasL;
      rec.rh.visible = rec.hasR;
      if (rec.hasL) { rec.lh.position.copy(cur.l.pos); rec.lh.quaternion.copy(cur.l.quat); }
      if (rec.hasR) { rec.rh.position.copy(cur.r.pos); rec.rh.quaternion.copy(cur.r.quat); }
      rec.tag.position.set(cur.h.pos.x, cur.h.pos.y + (rec.look[0] ? 0.42 : 0.3), cur.h.pos.z);

      const st = L.teams && inMyLevel(rec) && rec.hasH ? rec.lvState[L.id] : null;
      const team = st && (st.team === 0 || st.team === 1) ? st.team : -1;
      rec.vest.visible = team >= 0 && !(st.tagged && Math.floor(performance.now() / 120) % 2);

    }
    function firePitch() {

        const score = (b.sleeping ? 2 : 0) + (b.pos.distanceTo(HOPPER) < 1.2 ? 1 : 0) + (b.vel.lengthSq() < 0.25 ? 0.5 : 0);

      if (!M.next) { M.next = now + 2400; M.beeps = 0; }

    const _d = new V3(), _p = new V3();
    const ease = (u) => (u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2);
    const _bp = new V3();

      const s = L.swing;

      let ball = null;

        if (b.held || b.vel.z < 3 || b.pos.z > 0.8 || b.pos.z < -19) continue;

        let bestPerp = 0.2;

        for (let k = 1; k <= 60; k++) {
          const t = (k / 60) * dur;
          const phi = lerp(-0.2, Math.PI + 0.3, ease(t / dur));

          _bp.y -= 0.5 * GRAVITY * t * t;

          if (perp < bestPerp) { bestPerp = perp; pivotY = _bp.y; }
        }

          const t = (0.12 - ball.pos.z) / ball.vel.z;
          pivotY = ball.pos.y + ball.vel.y * t - 0.5 * GRAVITY * t * t;
        }
      }
      // hitting slightly under the ball's center lifts it

    L.deskHand = (side, mh, now) => {

    function floorAt(x0, x1, z0, z1, y, mat, down) {
      const w = x1 - x0, d = z1 - z0;
      const geo = uvScale(new THREE.PlaneGeometry(w, d, Math.max(1, Math.round(w)), Math.max(1, Math.round(d))), w / 2, d / 2);
      const m = new THREE.Mesh(geo, mat);
      m.rotation.x = down ? Math.PI / 2 : -Math.PI / 2;
      m.position.set((x0 + x1) / 2, y, (z0 + z1) / 2);
      G.add(m);
    }
    // a wall segment from (ax,az) to (bx,bz) whose front faces `face` (radians, like rotation.y)
    function wallSeg(ax, az, bx, bz, y0, y1, face) {
      const len = Math.hypot(bx - ax, bz - az), h = y1 - y0;
      if (len < 0.01 || h < 0.01) return;
      const geo = uvScale(new THREE.PlaneGeometry(len, h, Math.max(1, Math.round(len)), Math.max(1, Math.round(h / 1.5))), len / 2, h / 2);
      const m = new THREE.Mesh(geo, wallMat);
      m.position.set((ax + bx) / 2, (y0 + y1) / 2, (az + bz) / 2);
      m.rotation.y = face;
      G.add(m);
    }

    // rooms
    const DOOR = CORR_W / 2;
    ROOMS.forEach((r, i) => {
      floorAt(r.x0, r.x1, r.z0, r.z1, 0, floorMat);
      floorAt(r.x0, r.x1, r.z0, r.z1, WALL_H, ceilMat, true);
      wallSeg(r.x0, r.z1, r.x0, r.z0, 0, WALL_H, Math.PI / 2);
      wallSeg(r.x1, r.z0, r.x1, r.z1, 0, WALL_H, -Math.PI / 2);
      if (i < ROOMS.length - 1) {
        wallSeg(r.x0, r.z0, -DOOR, r.z0, 0, WALL_H, 0);
        wallSeg(DOOR, r.z0, r.x1, r.z0, 0, WALL_H, 0);
        wallSeg(-DOOR, r.z0, DOOR, r.z0, CORR_H, WALL_H, 0);
      } else wallSeg(r.x0, r.z0, r.x1, r.z0, 0, WALL_H, 0);
      if (i > 0) {
        wallSeg(r.x1, r.z1, DOOR, r.z1, 0, WALL_H, Math.PI);
        wallSeg(-DOOR, r.z1, r.x0, r.z1, 0, WALL_H, Math.PI);
        wallSeg(DOOR, r.z1, -DOOR, r.z1, CORR_H, WALL_H, Math.PI);
      } else wallSeg(r.x1, r.z1, r.x0, r.z1, 0, WALL_H, Math.PI);
      const light = new THREE.PointLight(i === ROOMS.length - 1 ? 0xffd27a : 0xffb070, 1.5, Math.max(r.w, r.d) * 1.25, 1.2);
      light.position.set(r.cx, 3.6, r.cz);
      G.add(light);
      r.light = light;
    });
    CORRS.forEach((c) => {
      floorAt(c.x0, c.x1, c.z0, c.z1, 0, floorMat);
      floorAt(c.x0, c.x1, c.z0, c.z1, CORR_H, ceilMat, true);
      wallSeg(c.x0, c.z1, c.x0, c.z0, 0, CORR_H, Math.PI / 2);
      wallSeg(c.x1, c.z0, c.x1, c.z1, 0, CORR_H, -Math.PI / 2);
    });

    // torches (flickering glow sprites on brackets)
    const torches = [];
    const flameMat = new THREE.SpriteMaterial({ map: warmGlowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, color: 0xffb060 });
    const coreMat = new THREE.SpriteMaterial({ map: paleSunTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, color: 0xffe6b0 });
    const ironMat = lam(0x2e2b33);
    function torch(x, z, inward) {
      const b = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.3, 0.08), ironMat);
      b.position.set(x + inward * 0.06, 2.25, z);
      G.add(b);
      const glow = new THREE.Sprite(flameMat);
      glow.position.set(x + inward * 0.1, 2.5, z);
      glow.scale.set(0.9, 0.9, 1);
      const core = new THREE.Sprite(coreMat);
      core.position.copy(glow.position);
      core.scale.set(0.22, 0.3, 1);
      G.add(glow, core);
      torches.push({ glow, core, phase: rand() * 100 });
    }
    ROOMS.forEach((r) => {
      for (const f of [-0.25, 0.25]) {
        torch(r.x0 + 0.02, r.cz + f * r.d, 1);
        torch(r.x1 - 0.02, r.cz + f * r.d, -1);
      }
    });
    CORRS.forEach((c) => torch(c.x0 + 0.02, (c.z0 + c.z1) / 2, 1));
    L.torches = torches;

    // banners beside each north doorway
    const bannerTex = canvasTexture(64, 128, (g) => {
      g.fillStyle = '#6b1d2a'; g.fillRect(0, 0, 64, 128);
      g.fillStyle = '#4e1420'; g.fillRect(0, 0, 6, 128); g.fillRect(58, 0, 6, 128);
      g.fillStyle = '#e8b54a';
      g.beginPath(); g.arc(32, 52, 13, 0, Math.PI * 2); g.fill();
      for (let k = 0; k < 8; k++) {
        const a = (k / 8) * Math.PI * 2;
        g.beginPath(); g.moveTo(32 + Math.cos(a) * 16, 52 + Math.sin(a) * 16); g.lineTo(32 + Math.cos(a + 0.2) * 24, 52 + Math.sin(a + 0.2) * 24); g.lineTo(32 + Math.cos(a - 0.2) * 24, 52 + Math.sin(a - 0.2) * 24); g.fill();
      }
      g.beginPath(); g.moveTo(0, 112); g.lineTo(32, 128); g.lineTo(64, 112); g.lineTo(64, 128); g.lineTo(0, 128); g.fillStyle = '#07060c'; g.fill();
    }).tex;
    const bannerMat = new THREE.MeshLambertMaterial({ map: bannerTex, transparent: true, alphaTest: 0.5 });
    ROOMS.forEach((r, i) => {
      if (i === ROOMS.length - 1) return;
      for (const sx of [-1, 1]) {
        const m = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 1.6), bannerMat);
        m.position.set(sx * (DOOR + 1.1), 2.9, r.z0 + 0.03);
        G.add(m);
      }
    });

    // gates (portcullis) at each room's north door
    L.gates = [];
    for (let i = 0; i < ROOMS.length - 1; i++) {
      const g = new THREE.Group();
      for (let k = 0; k < 7; k++) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.07, CORR_H, 0.07), ironMat);
        bar.position.set(-1.35 + k * 0.45, CORR_H / 2, 0);
        g.add(bar);
      }
      for (const y of [0.6, 1.6, 2.6]) {
        const bar = new THREE.Mesh(new THREE.BoxGeometry(2.9, 0.07, 0.07), ironMat);
        bar.position.set(0, y, 0);
        g.add(bar);
      }
      g.position.set(0, 0, ROOMS[i].z0);
      G.add(g);
      L.gates.push({ g, y: 0 });
    }

    // armory: sword rack (west), crossbow table (east)
    const woodMat = lam(0x5a3a22);
    addBox(G, 0.12, 0.08, 3.0, woodMat, -4.62, 1.1, 0);
    addBox(G, 0.3, 0.12, 3.0, woodMat, -4.55, 0.06, 0);
    for (const z of [-1.5, 1.5]) addBox(G, 0.08, 1.1, 0.08, woodMat, -4.62, 0.55, z);
    const downQ = new Q4().setFromUnitVectors(FWD, new V3(0, -1, 0));
    for (const z of [-1.05, -0.35, 0.35, 1.05]) makeTool(L, new V3(-4.45, 1.22, z), downQ, 'sword');
    addBox(G, 1.0, 0.08, 3.0, woodMat, 4.3, 0.88, 0);
    for (const [dx, dz] of [[-0.42, -1.4], [0.42, -1.4], [-0.42, 1.4], [0.42, 1.4]]) addBox(G, 0.08, 0.84, 0.08, woodMat, 4.3 + dx, 0.42, dz);
    const flatQ = new Q4();
    for (const z of [-1.0, -0.33, 0.33, 1.0]) makeTool(L, new V3(4.3, 0.98, z + 0.2), flatQ, 'crossbow');
    for (const [x, z] of [[-4.2, -4.2], [4.2, -4.2], [4.3, 3.0]]) addCyl(G, 0.32, 0.32, 0.9, 12, woodMat, x, 0.45, z);

    // decor in the deeper rooms
    const boneMat = lam(0xd8d2c0);
    for (let k = 0; k < 14; k++) {
      const r = ROOMS[2];
      const side = k % 2 ? 1 : -1;
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.1 + rand() * 0.05, 8, 6), boneMat);
      m.position.set(side * (r.w / 2 - 0.3 - rand() * 0.4), 0.1, r.cz - r.d / 2 + 1 + rand() * (r.d - 2));
      G.add(m);
    }
    {
      const r = ROOMS[3];
      addBox(G, 2.4, 0.5, 1.6, lam(0x2a2630), 0, 0.25, r.z0 + 1.2);
      addBox(G, 1.6, 2.6, 0.4, lam(0x3a3442), 0, 1.3, r.z0 + 0.5);
      for (const sx of [-1, 1]) {
        addCyl(G, 0.35, 0.25, 1.0, 10, ironMat, sx * (r.w / 2 - 1.2), 0.5, r.z0 + 1.2);
        const f = new THREE.Sprite(flameMat);
        f.position.set(sx * (r.w / 2 - 1.2), 1.4, r.z0 + 1.2);
        f.scale.set(1.6, 1.8, 1);
        G.add(f);
        torches.push({ glow: f, core: null, phase: rand() * 100, big: true });
      }
    }
    // vault: pedestal, chests, and the Sunstone
    const V = ROOMS[ROOMS.length - 1];
    addCyl(G, 0.32, 0.42, 1.0, 16, lam(0x4a4552), V.cx, 0.5, V.cz);
    const goldMat = new THREE.MeshLambertMaterial({ color: 0xe8b54a, emissive: 0x3a2400 });
    for (const [x, z] of [[-3, -3], [3, -3], [-3, 3], [3, 3]]) {
      addBox(G, 0.9, 0.55, 0.6, woodMat, x, 0.28, V.cz + z * 0.9);
      addBox(G, 0.8, 0.12, 0.5, goldMat, x, 0.6, V.cz + z * 0.9);
    }
    const sunMat = new THREE.MeshLambertMaterial({ color: 0xffc23a, emissive: 0xb86a00 });
    const sunstone = new THREE.Mesh(new THREE.IcosahedronGeometry(0.17, 0), sunMat);
    sunstone.position.set(V.cx, 1.32, V.cz);
    G.add(sunstone);
    const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map: warmGlowTex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, color: 0xffd060 }));
    sunGlow.position.copy(sunstone.position);
    sunGlow.scale.set(1.6, 1.6, 1);
    G.add(sunGlow);
    L.sunstone = sunstone;
    L.sunGlow = sunGlow;
    L.SUN_HOME = sunstone.position.clone();

    // geometry helpers shared with the rest of the level
    const inRect = (p, r, m) => p.x > r.x0 + m && p.x < r.x1 - m && p.z > r.z0 + m && p.z < r.z1 - m;
    L.inRect = inRect;
    L.roomAt = (p) => ROOMS.findIndex((r) => inRect(p, r, 0));
    L.walkable = (p) => ROOMS.some((r) => inRect(p, r, 0)) || CORRS.some((c) => p.x > c.x0 && p.x < c.x1 && p.z > c.z0 - 0.3 && p.z < c.z1 + 0.3);

    // ---------------------------------------------------------------- enemies
    // types: 0 goblin (melee), 1 skeleton archer, 2 stone warden (boss)
    const ETYPE = {
      0: { hp: 3, r: 0.42, h: 1.35, speed: 1.7, reach: 1.15, windup: 0.55, cool: 1.3 },
      1: { hp: 2, r: 0.36, h: 1.75, speed: 1.4, reach: 0, windup: 0.75, cool: 2.6 },
      2: { hp: 26, r: 0.95, h: 3.0, speed: 0.95, reach: 3.3, windup: 1.3, cool: 4.2 },
    };
    L.ETYPE = ETYPE;
    const TYPE_CODE = { g: 0, a: 1, b: 2 };
    const gobSkin = 0x6f9440, gobDark = 0x3e5a26;
    function enemyMesh(type) {
      const g = new THREE.Group();
      const mats = [];
      const M = (hex, emis) => { const m = new THREE.MeshLambertMaterial({ color: hex, emissive: emis || 0x000000 }); mats.push(m); return m; };
      const arm = new THREE.Group();
      if (type === 0) {
        const skin = M(gobSkin), dark = M(gobDark), cloth = M(0x5a3b2a);
        const body = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.28, 0.55, 10), cloth); body.position.y = 0.62;
        const head = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 10), skin); head.position.y = 1.07; head.scale.set(1, 0.9, 1);
        for (const sx of [-1, 1]) {
          const ear = new THREE.Mesh(new THREE.ConeGeometry(0.07, 0.3, 6), skin);
          ear.position.set(sx * 0.24, 1.12, 0.02); ear.rotation.z = -sx * 1.25;
          const eye = new THREE.Mesh(new THREE.SphereGeometry(0.035, 6, 5), new THREE.MeshBasicMaterial({ color: 0xffe14a }));
          eye.position.set(sx * 0.08, 1.1, -0.19);
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.38, 6), dark);
          leg.position.set(sx * 0.11, 0.19, 0);
          g.add(ear, eye, leg);
        }
        const nose = new THREE.Mesh(new THREE.ConeGeometry(0.05, 0.14, 6), skin); nose.position.set(0, 1.03, -0.22); nose.rotation.x = -Math.PI / 2;
        arm.position.set(0.28, 0.82, 0);
        const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.4, 6), skin); fore.position.set(0, -0.15, -0.05); fore.rotation.x = 0.4;
        const club = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.04, 0.6, 7), M(0x6b4a2a)); club.position.set(0, -0.15, -0.42); club.rotation.x = Math.PI / 2 - 0.3;
        arm.add(fore, club);
        g.add(body, head, nose, arm);
      } else if (type === 1) {
        const bone = M(0xe2dccb), dark = M(0x2a2630);
        const spine = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, 0.7, 6), bone); spine.position.y = 1.05;
        const ribs = new THREE.Mesh(new THREE.SphereGeometry(0.2, 10, 8, 0, Math.PI * 2, 0, Math.PI * 0.6), bone); ribs.position.y = 1.15; ribs.scale.set(1, 1.1, 0.7);
        const pelvis = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.1, 0.14), bone); pelvis.position.y = 0.72;
        const skull = new THREE.Mesh(new THREE.SphereGeometry(0.16, 12, 10), bone); skull.position.y = 1.55;
        for (const sx of [-1, 1]) {
          const sock = new THREE.Mesh(new THREE.SphereGeometry(0.04, 6, 5), new THREE.MeshBasicMaterial({ color: 0x8fd0ff }));
          sock.position.set(sx * 0.06, 1.57, -0.13);
          const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.035, 0.03, 0.7, 6), bone); leg.position.set(sx * 0.1, 0.36, 0);
          g.add(sock, leg);
        }
        arm.position.set(-0.22, 1.3, 0);
        const bow = new THREE.Mesh(new THREE.TorusGeometry(0.35, 0.02, 5, 16, Math.PI * 0.9), M(0x5a3a22));
        bow.rotation.set(0, Math.PI / 2, Math.PI / 2 + Math.PI * 0.05); bow.position.set(0, 0, -0.3);
        const limb = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.35, 6), bone); limb.rotation.x = Math.PI / 2; limb.position.z = -0.15;
        arm.add(limb, bow);
        const hood = new THREE.Mesh(new THREE.ConeGeometry(0.22, 0.4, 10, 1, true), dark); hood.position.y = 1.68;
        g.add(spine, ribs, pelvis, skull, arm, hood);
      } else {
        const stone = M(0x6d6876), dark = M(0x48444f), glow = M(0x301000, 0xff6a1a);
        const legs = [];
        for (const sx of [-1, 1]) { const leg = new THREE.Mesh(new THREE.BoxGeometry(0.5, 1.1, 0.55), dark); leg.position.set(sx * 0.42, 0.55, 0); legs.push(leg); }
        const torso = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.25, 0.95), stone); torso.position.y = 1.75;
        const core = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.42, 0.1), glow); core.position.set(0, 1.85, -0.48);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.52, 0.55), stone); head.position.y = 2.65;
        for (const sx of [-1, 1]) {
          const eye = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.06, 0.04), glow); eye.position.set(sx * 0.14, 2.7, -0.28);
          g.add(eye);
        }
        arm.position.set(0, 2.1, 0);
        for (const sx of [-1, 1]) {
          const a = new THREE.Mesh(new THREE.BoxGeometry(0.42, 1.25, 0.45), stone); a.position.set(sx * 1.05, -0.45, 0);
          const fist = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.5, 0.6), dark); fist.position.set(sx * 1.05, -1.2, 0);
          arm.add(a, fist);
        }
        g.add(torso, core, head, arm, ...legs);
      }
      // health bar
      const bar = new THREE.Group();
      const bg = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.08), new THREE.MeshBasicMaterial({ color: 0x1b1932, depthWrite: false, transparent: true, opacity: 0.8 }));
      const fill = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.06), new THREE.MeshBasicMaterial({ color: 0xff4d5a, depthWrite: false, transparent: true }));
      fill.position.z = 0.001;
      bar.add(bg, fill);
      bar.position.y = ETYPE[type].h + (type === 2 ? 0.45 : 0.25);
      bar.scale.x = type === 2 ? 2.2 : 0.6;
      bar.visible = false;
      g.add(bar);
      const shadow = makeShadow(g, ETYPE[type].r * 2.2);
      shadow.position.y = 0.01;
      G.add(g);
      return { g, mats, arm, bar, fill };
    }

    // ring that warns where the warden is about to slam
    const slamRing = new THREE.Mesh(new THREE.RingGeometry(ETYPE[2].reach - 0.25, ETYPE[2].reach, 48), new THREE.MeshBasicMaterial({ color: 0xff3a2a, transparent: true, opacity: 0, depthWrite: false, side: THREE.DoubleSide }));
    slamRing.rotation.x = -Math.PI / 2;
    slamRing.position.y = 0.02;
    slamRing.visible = false;
    G.add(slamRing);

    // shared state; on the host these are authoritative, elsewhere they mirror the host
    L.q = { r: 0, pg: 0, wave: 0, spawned: 0, done: 0 };
    L.enemies = new Map();    // id -> enemy
    L.projs = new Map();      // id -> enemy arrow
    L.pickups = new Map();    // id -> coin or potion
    L.claimed = new Set();    // pickup ids anyone has taken
    L.nextId = 1;
    const host = { waveT: 0, summonT: 0, projLog: [] };
    L.hostState = host;

    function makeEnemy(id, type, x, z) {
      const T = ETYPE[type];
      const e = { id, type, x, z, yaw: 0, hp: T.hp, hpMax: T.hp, st: 0, ac: 0, t: 0, cd: 1 + rand(), rx: x, rz: z, ryaw: 0, lastAc: 0, flash: 0, dieT: 0, room: L.roomAt(new V3(x, 0, z)), strafe: rand() < 0.5 ? 1 : -1 };
      Object.assign(e, enemyMesh(type));
      e.g.position.set(x, 0, z);
      L.enemies.set(id, e);
      return e;
    }
    function removeEnemy(e) {
      G.remove(e.g);
      for (const m of e.mats) m.dispose();
      L.enemies.delete(e.id);
    }
    L.makeEnemy = makeEnemy;
    L.removeEnemy = removeEnemy;

    function spawnWave(roomIdx, wave) {
      const r = ROOMS[roomIdx];
      const n = 1 + playerCount();
      for (const [code, ox, oz] of r.waves[wave]) {
        const type = TYPE_CODE[code];
        const e = makeEnemy(L.nextId++, type, r.cx + ox, r.cz + oz);
        if (type === 2) { e.hp = e.hpMax = 14 + 8 * Math.min(4, n); host.summonT = performance.now() + 9000; sfx('roar', 0.9); }
      }
      forcePresence();
    }
    function playerCount() {
      let n = 0;
      for (const rec of remotes.values()) if (rec.lv === L.idx && rec.inGame) n++;
      return n;
    }

    function dropLoot(e) {
      const coins = e.type === 2 ? 14 : 2 + Math.floor(rand() * 3);
      for (let k = 0; k < coins; k++) {
        const a = rand() * Math.PI * 2, d = 0.3 + rand() * (e.type === 2 ? 1.6 : 0.6);
        L.pickups.set(L.nextId, { id: L.nextId, type: 0, x: e.x + Math.cos(a) * d, z: e.z + Math.sin(a) * d });
        L.nextId++;
      }
      if (rand() < (e.type === 2 ? 1 : 0.28)) {
        L.pickups.set(L.nextId, { id: L.nextId, type: 1, x: e.x, z: e.z + 0.2 });
        L.nextId++;
      }
    }
    // the host applies damage reported by any player (including itself)
    L.damageEnemy = (id, dmg) => {
      const e = L.enemies.get(id);
      if (!e || e.st === 3) return false;
      e.hp -= dmg;
      e.flash = 0.15;
      if (e.hp <= 0) {
        e.hp = 0; e.st = 3; e.t = 0.6;
        dropLoot(e);
        sfx('poof', 0.8 / (1 + Math.hypot(e.x - myHead.pos.x, e.z - myHead.pos.z) * 0.08));
        if (e.type === 2) { showToast('The Warden crumbles!'); sfx('roar', 0.7); }
      } else if (e.type !== 2) {
        // small knockback away from the nearest player
        const tgt = nearestTarget(e, currentTargets());
        if (tgt) { const dx = e.x - tgt.pos.x, dz = e.z - tgt.pos.z, d = Math.hypot(dx, dz) || 1; e.x += (dx / d) * 0.35; e.z += (dz / d) * 0.35; }
        if (e.st === 1) { e.st = 0; e.cd = 0.8; }
      }
      forcePresence();
      return true;
    };

    // who can be targeted: everyone in this game who is playing and not down
    function currentTargets() {
      const list = [];
      if (state.mode !== 'menu' && !L.me.down) list.push({ id: state.myPeer, pos: myHead.pos });
      for (const rec of remotes.values()) {
        if (rec.lv !== L.idx || !rec.inGame || !rec.hasH) continue;
        const st = rec.lvState[L.id];
        if (st && st.down) continue;
        list.push({ id: rec.peer, pos: rec.cur.h.pos });
      }
      return list;
    }
    L.currentTargets = currentTargets;
    function nearestTarget(e, targets) {
      let best = null, bd = Infinity;
      for (const t of targets) {
        const d = Math.hypot(t.pos.x - e.x, t.pos.z - e.z);

  // ================================================================ LEVEL: MOONLIGHT LANES (bowling)
  // Standard ten-pin scoring. Returns the frames so far, the running total,
  // and what the next ball needs: which frame, which ball, and whether the rack is fresh.
  function bowlAnalyze(rolls) {
    const frames = [];
    let i = 0, total = 0;
    const mark = (n) => (n === 0 ? '-' : String(n));
    for (let f = 0; f < 10; f++) {
      if (f < 9) {
        if (i >= rolls.length) return { frames, total, frame: f, ball: 0, fresh: true, done: false };
        const a = rolls[i];
        if (a === 10) {
          const b = rolls[i + 1], c = rolls[i + 2];
          const known = b !== undefined && c !== undefined;
          if (known) total += 10 + b + c;
          frames.push({ marks: ['X'], score: known ? total : null });
          i += 1;
          continue;
        }
        if (i + 1 >= rolls.length) {
          frames.push({ marks: [mark(a)], score: null });
          return { frames, total, frame: f, ball: 1, fresh: false, done: false };
        }
        const b = rolls[i + 1];
        if (a + b === 10) {
          const c = rolls[i + 2];
          if (c !== undefined) total += 10 + c;
          frames.push({ marks: [mark(a), '/'], score: c !== undefined ? total : null });
        } else {
          total += a + b;
          frames.push({ marks: [mark(a), mark(b)], score: total });
        }
        i += 2;
      } else {
        const r = rolls.slice(i, i + 3);
        const marks = [];
        let fresh = true;
        r.forEach((n, k) => {
          if (fresh && n === 10) { marks.push('X'); fresh = true; }
          else if (!fresh && n + r[k - 1] === 10) { marks.push('/'); fresh = true; }
          else { marks.push(mark(n)); fresh = !fresh ? true : false; if (k === 0) fresh = false; }

        const a = r[0], b = r[1];
        const allowed = a === undefined || b === undefined ? 3 : (a === 10 || a + b === 10 ? 3 : 2);
        const doneTenth = r.length >= allowed && r.length >= 2;
        if (doneTenth) total += r.slice(0, allowed).reduce((s, n) => s + n, 0);
        frames.push({ marks, score: doneTenth ? total : null });
        if (doneTenth) return { frames, total, frame: 9, ball: r.length, fresh: true, done: true };
        // what does the next ball face?
        let nextFresh;
        if (r.length === 0) nextFresh = true;
        else if (r.length === 1) nextFresh = a === 10;
        else nextFresh = (a === 10 && b === 10) || (a !== 10 && a + b === 10);
        return { frames, total, frame: 9, ball: r.length, fresh: nextFresh, done: false };
      }
    }
    return { frames, total, frame: 9, ball: 0, fresh: true, done: true };
  }

    // ---------------------------------------------------------------- my game
    L.me = { lane: -1, rolls: [], phase: 'ready', t0: 0, best: 0, games: 0, side: 'right', standingBefore: 10, rollStart: 0 };
    const me = L.me;
    const ball = { pos: new V3(), vel: new V3(), gutter: false, hitPins: false, stillT: 0 };
    const pins = SPOTS.map(([sx, sz], i) => ({ i, sx, sz, x: sx, z: sz, vx: 0, vz: 0, state: 0, tilt: 0, tdir: 0 }));

      const span = document.createElement('span');
      span.textContent = nm;
      label.append(input, span);
      el.append(label);
      input.addEventListener('change', () => {
        if (!input.checked) return;
        state[key] = i;
        savePrefs();
        drawPreview();
        forcePresence();
      });
    });
  }
  function setColor(i) {
    state.colorIdx = i;
    const hex = PLAYER_COLORS[i].hex;
    myHandMat.color.set(hex);
    discgolf.setColor(hex);
    minigolf.setColor(hex);
    bowling.setColor(hex);
    karts.setColor(hex);
    drawPreview();
    savePrefs();
    state.dirtyBoard = true;
    forcePresence();
  }
  function syncLookInputs() {
    ui.swatches.querySelectorAll('input').forEach((el, i) => { el.checked = i === state.colorIdx; });
    if (ui.hatChips) ui.hatChips.querySelectorAll('input').forEach((el, i) => { el.checked = i === state.hat; });
    if (ui.faceChips) ui.faceChips.querySelectorAll('input').forEach((el, i) => { el.checked = i === state.face; });
  }
  // the clubhouse's look station calls this
  function cycleLook(kind) {
    if (kind === 'hat') state.hat = (state.hat + 1) % HATS.length;
    else if (kind === 'face') state.face = (state.face + 1) % FACES.length;
    else { setColor((state.colorIdx + 1) % PLAYER_COLORS.length); }
    savePrefs();
    drawPreview();
    syncLookInputs();
    forcePresence();
    showToast(kind === 'hat' ? `Hat: ${HATS[state.hat]}` : kind === 'face' ? `Face: ${FACES[state.face]}` : `Color: ${PLAYER_COLORS[state.colorIdx].label}`);
  }
  chipGroup(ui.hatChips, HATS, 'hat');
  chipGroup(ui.faceChips, FACES, 'face');
  drawPreview();
  ui.flatBtn.addEventListener('click', () => { ensureAudio(); ui.flatBtn.blur(); startGame('flat'); });
  ui.vrBtn.addEventListener('click', enterVR);
  ui.menuBtn.addEventListener('click', () => { ui.menuBtn.blur(); toMenu(); });

  // ---------------------------------------------------------------- HUD + boards
  function playerRows(L) {
    const rows = [Object.assign({ name: state.name, color: PLAYER_COLORS[state.colorIdx].hex, me: true }, L.rowFor(null, true))];
    for (const rec of remotes.values()) {
      if (!inMyLevel(rec)) continue;
      const st = rec.lvState[L.id] || {};
      rows.push(Object.assign({ name: rec.name, color: PLAYER_COLORS[rec.colorIdx] ? PLAYER_COLORS[rec.colorIdx].hex : '#ffffff', me: false }, L.rowFor(st, false)));
    }
    rows.sort((a, b) => L.sortRows(a, b) || (a.me ? -1 : b.me ? 1 : a.name.localeCompare(b.name)));
    return rows;
  }
  function renderHudScores(rows) {
    ui.hudScores.replaceChildren(...rows.slice(0, 8).map((p) => {
      const li = document.createElement('li');
      if (p.me) li.className = 'me';
      const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = p.color;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = p.me ? `${p.name} (you)` : p.name;
      const sc = document.createElement('span'); sc.className = 'sc'; sc.textContent = p.text;
      li.append(sw, nm, sc);
      return li;
    }));
  }
  function renderHud() {
    const L = curLevel();
    ui.hudTitle.textContent = L.meta.name;
    ui.hudLevelActions.replaceChildren(...L.hudActions.map((a) => {
      const b = document.createElement('button');
      b.className = 'hud-btn';
      b.type = 'button';
      b.textContent = a.label();
      b.addEventListener('click', () => { b.blur(); a.run(); state.hudDirty = true; });
      return b;
    }));
    const hs = L.hintsFor ? L.hintsFor() : L.hints;
    ui.hints.replaceChildren(...hs.map(([k, t]) => {
      const s = document.createElement('span');
      const kb = document.createElement('kbd');
      kb.textContent = k;
      s.append(kb, document.createTextNode(t));
      return s;
    }));
    ui.hints.hidden = coarse;
    ui.grabBtn.hidden = !!L.grabless;
    ui.throwBtn.hidden = !!L.noLocomotion;
    ui.throwBtn.textContent = L.throwLabel ? L.throwLabel() : holdingTool() ? 'Swing' : 'Hold to throw';
  }
  function updateUi(now) {
    const L = curLevel();
    if (state.dirtyBoard && now - state.boardT > 250) {
      state.dirtyBoard = false;
      state.boardT = now;
      const rows = playerRows(L);
      L.drawBoard(rows);
      renderHudScores(rows);
    }
    if (state.hudDirty && state.mode === 'flat') { state.hudDirty = false; renderHud(); }
    if (state.charge !== null) ui.powerFill.style.width = `${Math.round(Math.min(1, (now - state.charge) / 1000) * 100)}%`;
    if (now - state.netUiT > 500) { state.netUiT = now; updateNetUI(); }
  }

  function onResize() {
    if (renderer.xr.isPresenting) return;
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', onResize);
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => {
      for (const f of redraws.slice()) f();
      state.dirtyBoard = true;
      for (const rec of remotes.values()) {
        if (rec.colorIdx >= 0) { drawTag(rec.tagC.g, rec.name, PLAYER_COLORS[rec.colorIdx].hex); rec.tagC.tex.needsUpdate = true; }
      }
    });
  }

  // ---------------------------------------------------------------- main loop
  hoops.throwSpeed = [3, 12, 0.2];
  baseball.throwSpeed = [4, 24, 0.08];
  baseball.lockWhileHolding = true;
  discgolf.walkSpeed = 3.4;
  curLevel().group.visible = true;
  applyEnv(curLevel().env);

  let lastT = performance.now();
  renderer.setAnimationLoop(() => {
    const now = performance.now();
    const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000));
    lastT = now;
    pollPeers();
    const L = curLevel();
    if (state.mode === 'menu') L.attract(now);
    else if (state.mode === 'flat') flatUpdate(dt);
    updateMyPose(now);
    if (state.mode === 'vr') vrUpdate(dt, now);
    if (state.mode === 'flat') {
      state.flatTarget = findFlatTarget();
      ui.cross.classList.toggle('on', !!state.flatTarget || !!state.held);
    }
    updateRemotes(dt);
    updateBodies(L, dt, now);
    L.update(dt, now);
    updateButtons(L, now);
    updateFloats(now);
    updateUi(now);
    netTick(now);
    renderer.render(scene, camera);
  });

  checkVR();
  initNet();
  updateNetUI();
})();
</script>
</body>
</html>
